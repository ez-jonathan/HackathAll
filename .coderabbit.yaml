# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# ==============================================================================
# CodeRabbit Configuration - High-Speed Hackathon Profile
# ==============================================================================
# Priorities:
# 1. Zero blocker fatigue: Never block PRs or generate pedantic style noise.
# 2. Critical Safety: Flag exposed API keys, broken routing, syntax errors, and build killers.
# 3. Fast Summaries: Provide quick PR overviews so judges/teammates know what changed.
# ==============================================================================

language: "en-US"
early_access: false
tone_instructions: "Be direct, concise, and pragmatic. Adopt a supportive hackathon coach mindset. Prioritize speed-to-demo over perfection."

reviews:
  profile: "chill"
  request_changes_workflow: false  # Never block PR merges during a 24h sprint
  high_level_summary: true         # Generate concise executive summary of the changes
  poem: false                      # Omit poems to preserve review brevity
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "master"
      - "dev"
  
  # Hackathon-Specific Review Instructions
  path_instructions:
    - path: "**/*"
      instructions: |
        CRITICAL HACKATHON REVIEW INVARIANTS:
        1. FLAG ONLY:
           - Exposed credentials, secrets, or API tokens (OpenAI, Anthropic, Gemini, AWS, Stripe).
           - Fatal syntax errors, broken imports, missing dependencies, or build-crashing bugs.
           - Unhandled null/undefined references on the Happy Path demo route.
           - Broken Next.js App Router exports or invalid dynamic params.
        2. STRICTLY IGNORE:
           - Missing unit/integration tests or test coverage metrics.
           - Code style, formatting, whitespace, or naming convention pedantry.
           - Missing docstrings, JSDoc comments, or comprehensive type strictness (allow 'any' if it unblocks velocity).
           - Premature micro-optimizations (memoization, re-render optimizations) unless catastrophic.
           - Mock data usage. Mocks and stubs are deliberate design patterns for hackathons.
        3. BREVITY: Keep review comments to a maximum of 2-3 sentences with a direct copy-paste fix where applicable.

    - path: "pitch/**"
      instructions: |
        Review pitch materials and demo scripts for clarity, brevity, and alignment with judge presentation criteria.

  path_filters:
    - "!**/*.lock"
    - "!**/package-lock.json"
    - "!**/pnpm-lock.yaml"
    - "!**/yarn.lock"
    - "!**/dist/**"
    - "!**/.next/**"
    - "!**/out/**"
    - "!**/build/**"
    - "!**/public/mock/**"
    - "!**/data/seed.json"
    - "!**/*.min.*"

chat:
  auto_reply: true
